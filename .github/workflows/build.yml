name: Build and release

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      full:
        description: Verify every profile
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.profiles.outputs.versions }}
      build: ${{ steps.profiles.outputs.build }}
      full: ${{ steps.profiles.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CLI and profile selection
        run: python3 -m unittest discover -s tests -v
      - name: Select profiles to verify
        id: profiles
        env:
          FULL: ${{ inputs.full || false }}
        run: |
          args=()
          if [ "$FULL" = true ]; then args+=(--full); fi
          python3 tests/select_profiles.py "${args[@]}"

  verify:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build compiler
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: moode-cross:test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check CLI and failure handling
        run: |
          docker run --rm --entrypoint python3 moode-cross:test -m unittest discover -s /opt/tests -v
          docker run --rm moode-cross:test list-profiles
          if docker run --rm --read-only --tmpfs /tmp moode-cross:test build --pi-model 3b+ --moode-version 10.3.6; then
            echo 'Expected read-only output to fail'; exit 1
          fi
      - name: Cross-build and verify cache reuse
        if: needs.plan.outputs.full == 'true'
        run: |
          mkdir -p dist cached-dist
          docker volume create moode-build-cache
          docker run --rm -v "$PWD/dist:/out" -v moode-build-cache:/cache moode-cross:test build --pi-model 3b+ --moode-version 10.3.6
          docker run --rm -v "$PWD/cached-dist:/out" -v moode-build-cache:/cache moode-cross:test build --pi-model 3b+ --moode-version r1036
          grep -q 'Finished .*release' cached-dist/build.log
          if grep -q '^   Compiling ' cached-dist/build.log; then
            echo 'Cargo did not reuse the compiled cache'; exit 1
          fi
          cd dist && sha256sum -c SHA256SUMS
      - name: Build selected release profiles
        env:
          VERSIONS: ${{ needs.plan.outputs.versions }}
        run: |
          mkdir -p profile-dist
          docker run --rm -v "$PWD/profile-dist:/out" -v moode-build-cache:/cache \
            --entrypoint python3 moode-cross:test /opt/tests/build_profiles.py --versions-json "$VERSIONS"
      - name: Install and check in clean ARM64 Trixie
        run: |
          docker build -f tests/Dockerfile.runtime -t moode-cross:runtime .
          docker run --rm --platform linux/arm64 -v "$PWD/profile-dist:/artifacts:ro" moode-cross:runtime
      - name: Verify exported sources offline
        run: |
          docker run --rm --network none -v "$PWD/profile-dist:/artifacts:ro" \
            --entrypoint python3 moode-cross:test /opt/tests/check_source_exports.py /artifacts
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: renderers-moode-10.3.6-arm64
          # AirPlay publication is deferred pending its separate license review.
          path: |
            profile-dist/10.3.6/librespot/
            profile-dist/10.3.6/qobuz/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: renderers-moode-10.3.6-arm64
          path: dist
      # Compiler-image publication is suspended until its separate source audit is complete.
      - name: Check release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must have the form v1.2.3'; exit 1
          fi
      - name: Verify redistribution materials
        run: |
          python3 tests/check_redistribution.py dist
          python3 tests/check_release_scope.py dist
          python3 tests/review_licenses.py dist --output license-selections.json
      - name: Prepare draft for licensing review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          tar -czf moode-10.3.6-renderers-arm64.tar.gz -C dist .
          sha256sum dist/*/*.deb dist/*/*_sources.tar.gz dist/*/*_notices.tar.gz moode-10.3.6-renderers-arm64.tar.gz license-selections.json | sed 's@dist/[^/]*/@@' > SHA256SUMS
          gh release create "$VERSION" dist/*/*.deb dist/*/*_sources.tar.gz dist/*/*_notices.tar.gz moode-10.3.6-renderers-arm64.tar.gz license-selections.json SHA256SUMS --draft --verify-tag --notes-file docs/release-notes.md --title "$VERSION"
